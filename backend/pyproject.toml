[project]
name = "saint-backend"
version = "0.1.0"
description = "Backend de Saint: agentes de IA para WhatsApp e Instagram"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<1.21",
    "pgvector>=0.5,<0.6",
    "pydantic-settings>=2.16,<3",
    "fastapi>=0.125,<0.200",
    "uvicorn[standard]>=0.38,<1",
    "redis>=7,<8",
    "httpx>=0.28,<1",
    "cryptography>=46,<50",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
