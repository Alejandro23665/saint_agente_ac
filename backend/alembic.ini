# Configuración de Alembic (migraciones de la base de datos).
# La URL de conexión NO va aquí: env.py la toma de DATABASE_ADMIN_URL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Nombre de archivo: 0001_descripcion.py (número correlativo, fácil de ordenar).
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
level = NOTSET
formatter = generic
args = (sys.stderr,)
class = StreamHandler

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
